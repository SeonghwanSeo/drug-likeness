dataset:
  path: data/my-parquet # Local dataset directory or Hugging Face dataset ID.
  name: null
  train_split: train
  val_split: null # Set to your validation split name if available.
  max_length: 255
  enumerate_stereo: false
  num_workers: 2

train:
  model: large
  stage: finetune
  pretrained_model: large-chembl # Model alias, Hugging Face model ID, or local model directory.
  batch_size: 64
  global_batch_size: 64
  max_epochs: 10
  lr: 0.0001
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  gradient_clip_val: 1.0
  warmup_steps: 0
  lr_scheduler: constant

run:
  seed: 42
  save_dir: results/chemprior/finetune/
  resume_checkpoint: null
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  compile_model: true
  compile_mode: default
  save_every_n_epochs: 1
  val_every_n_epochs: 1
  log_every_n_steps: 1
  use_wandb: false
  wandb_project: chemprior
