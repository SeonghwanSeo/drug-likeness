dataset:
  path: SeonghwanSeo/chemprior-data
  name: pretrain
  train_split: train
  val_split: null
  max_length: 127
  enumerate_stereo: false
  num_workers: 2

train:
  model: medium
  stage: pretrain
  pretrained_model: null
  batch_size: 512
  global_batch_size: 16384
  max_epochs: 10
  lr: 0.0003
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  gradient_clip_val: 1.0
  warmup_steps: 2000
  decay_steps: 0
  min_lr_ratio: 0.1

run:
  seed: 42
  save_dir: results/chemprior-medium/pretrain
  resume_checkpoint: null
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  compile_model: true
  compile_mode: default
  save_every_n_epochs: 0.1
  val_every_n_epochs: 1
  log_every_n_steps: 100
  use_wandb: false
