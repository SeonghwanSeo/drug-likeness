# Model
model: medium
stage: stage1_zinc20
seed: 42

# Data and checkpoints
train_data: "???"
val_data: null
save_dir: result/deepdl2/medium_stage1_zinc20
pretrained_model: null
resume_checkpoint: null

# Runtime and batch size
accelerator: gpu
devices: auto
precision: bf16-mixed
batch_size: 512
global_batch_size: 16384

# Data loading
num_workers: 2
shuffle_buffer: 100000
max_length: 127

# Training duration
max_epochs: 10

# Optimizer
lr: 0.0003
betas: [0.9, 0.95]
eps: 1.0e-8
weight_decay: 0.01
gradient_clip_val: 1.0

# LR schedule
warmup_steps: 2000
decay_steps: 0
min_lr_ratio: 0.1

# Compilation
compile_model: true
compile_mode: default

# Checkpointing and logging
save_every_n_steps: 11718
val_every_n_steps: 1000
log_every_n_steps: 100
use_wandb: false
