[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "druglikeness"
description = 'AI-based drug-likeness scoring'
authors = [{ name = "Seonghwan Seo", email = "shwan0106@gmail.com" }]
version = "0.9.1"
readme = "README.md"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
keywords = ["rnn", "drug-likeness"]
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy", "rdkit", "huggingface-hub>=0.23", "tqdm"]
[project.urls]
"Homepage" = "https://github.com/SeonghwanSeo/drug-likeness"

[project.optional-dependencies]
train = ["lightning", "wandb", "pyarrow", "datasets>=4", "fsspec", "beautifulsoup4", "pyyaml"]

[tool.setuptools.package-data]
"druglikeness.chemprior" = ["vocab.txt", "cleaning.json"]

[tool.ruff]
target-version = "py39"
line-length = 90
[tool.ruff.lint]
select = ["E", "F", "B", "UP", "T203", "I"]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
